<div class="terminal-container flex flex-col font-share text-sm h-[320px] md:h-[400px] border border-cyber-cyan/30 bg-cyber-bg-dim/80 backdrop-blur-md p-4 relative overflow-hidden shadow-[0_0_15px_rgba(0,240,255,0.15)] cyber-cut-tr cursor-text" (click)="focusInput()">
  <!-- Scanner Scanline -->
  <div class="cyber-scanline absolute top-0 left-0 w-full h-[3px] bg-cyber-cyan/20 animate-cyber-scan pointer-events-none z-10"></div>
  
  <!-- Terminal Header Status bar -->
  <div class="flex justify-between items-center text-xs text-cyber-cyan border-b border-cyber-cyan/20 pb-2 mb-3 select-none no-print">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-cyber-cyan animate-pulse"></span>
      <span>DECK_CONNECTION: SECURE</span>
    </div>
    <span>NET.RUNNER // TERMINAL_SH</span>
  </div>

  <!-- Terminal Output logs -->
  <div #outputContainer class="flex-1 overflow-y-auto pr-2 space-y-4" aria-live="polite">
    @for (log of history(); track $index) {
      <div>
        <div class="flex items-center text-cyber-yellow select-none">
          <span class="text-cyber-pink mr-1.5">&gt;</span>
          <span class="font-semibold">{{ log.input }}</span>
        </div>
        <div class="mt-1 space-y-0.5" [class.text-cyber-pink]="log.isError" [class.text-cyber-green]="!log.isError">
          @for (line of log.output; track $index) {
            <p class="whitespace-pre-wrap leading-relaxed">{{ line }}</p>
          }
        </div>
      </div>
    }
  </div>

  <!-- Input Form -->
  <form (submit)="executeCommand(); $event.preventDefault()" class="mt-3 flex items-center border-t border-cyber-cyan/10 pt-3 select-none no-print">
    <span class="text-cyber-cyan mr-2 select-none">guest&#64;runner:~$</span>
    <input #cmdInput
           type="text"
           [ngModel]="command()"
           (ngModelChange)="command.set($event)"
           name="terminalCommand"
           (keydown)="onKeydown($event)"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"
           class="flex-1 bg-transparent border-0 outline-none text-cyber-yellow font-share text-sm placeholder-cyber-cyan/25 focus:ring-0 focus:outline-none"
           placeholder="Gõ lệnh ở đây... (help)" />
  </form>
</div>
