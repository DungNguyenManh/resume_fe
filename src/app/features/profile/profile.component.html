<div class="flex flex-col md:flex-row items-center justify-between gap-6 relative">

  <!-- Left Column: Name, Title, Address -->
  <div class="flex-1 text-center md:text-left w-full md:w-auto">
    <h1 class="text-3xl md:text-4xl font-extrabold text-text-primary tracking-tight mb-2">{{ 'resume.profile.name' |
      translate }}</h1>
    <p class="text-lg md:text-xl text-lilac font-semibold mb-3">{{ 'resume.profile.title' | translate }}</p>
    <span class="flex items-center justify-center md:justify-start gap-1.5 text-sm text-gray-600">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
        class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
      </svg>
      {{ 'resume.profile.location' | translate }}
    </span>
  </div>

  <!-- Center Column: Avatar (clickable, opens PhotoSwipe lightbox) -->
  <div #avatarGallery class="relative w-32 h-32 md:w-40 md:h-40 shrink-0 mx-auto">
    <a href="assets/avatars/main.jpg" data-pswp-width="1080" data-pswp-height="1080" target="_blank" rel="noopener"
      class="block w-full h-full rounded-full overflow-hidden border-[3px] border-white/60 shadow-lg relative bg-[#E6E6FA] liquid-glass-avatar-frame cursor-zoom-in">
      <img src="assets/avatars/main.jpg" alt="Avatar" class="absolute inset-0 w-full h-full object-cover">
    </a>
  </div>

  <!-- Right Column: Email, Phone, LinkedIn -->
  <div class="flex-1 w-full flex flex-col gap-3 text-sm text-gray-600 justify-center items-center md:items-end">
    <a [href]="'mailto:' + ('resume.profile.email' | translate)"
      class="flex items-center gap-1.5 text-lilac transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
        class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
      </svg>
      {{ 'resume.profile.email' | translate }}
    </a>
    <span class="flex items-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
        class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 6.75Z" />
      </svg>
      {{ 'resume.profile.phone' | translate }}
    </span>
    <a [href]="'https://linkedin.com/in/' + ('resume.profile.linkedin' | translate)" target="_blank" rel="noopener"
      class="flex items-center gap-1.5 text-lilac transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5">
        <path
          d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
      </svg>
      {{ 'resume.profile.linkedin' | translate }}
    </a>
  </div>
</div>
