<app-cyber-panel themeColor="cyan" title="SYSTEM_DECK">
  <!-- Avatar HUD Frame -->
  <div class="flex justify-center mb-6">
    <div class="relative w-36 h-36 border border-cyber-pink/40 p-1.5 cyber-cut-both group">
      <div class="absolute inset-0 bg-cyber-pink/5 group-hover:bg-cyber-pink/10 transition-all duration-300 pointer-events-none"></div>
      
      <div class="w-full h-full border border-cyber-pink bg-cyber-darker flex flex-col justify-center items-center text-cyber-pink overflow-hidden select-none font-share">
        <span class="text-3xl font-extrabold tracking-widest animate-pulse">{{ data.avatarText }}</span>
        <span class="text-[9px] uppercase tracking-widest mt-2 text-cyber-cyan/70">CHROME_CORE</span>
        <div class="absolute bottom-1 w-full text-center text-[7px] text-cyber-pink/50 animate-cyber-flicker">RUNNING: SYSTEM_CV</div>
      </div>
      
      <!-- Glow lines -->
      <span class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-cyber-pink"></span>
      <span class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-cyber-pink"></span>
    </div>
  </div>

  <!-- Profile details -->
  <div class="space-y-3 font-share text-sm text-cyber-text">
    <div class="flex justify-between border-b border-cyber-gray/20 pb-1.5">
      <span class="text-cyber-gray">USER_NAME:</span>
      <span class="text-cyber-yellow font-semibold">{{ data.name }}</span>
    </div>
    <div class="flex justify-between border-b border-cyber-gray/20 pb-1.5">
      <span class="text-cyber-gray">IDENTITY_CODE:</span>
      <span class="text-cyber-cyan font-semibold uppercase">{{ data.alias }}</span>
    </div>
    <div class="flex justify-between border-b border-cyber-gray/20 pb-1.5">
      <span class="text-cyber-gray">CURRENT_SECTOR:</span>
      <span class="text-cyber-cyan text-right text-xs">{{ data.sector }}</span>
    </div>
    <div class="flex justify-between border-b border-cyber-gray/20 pb-1.5">
      <span class="text-cyber-gray">DECK_IP:</span>
      <span class="text-cyber-yellow font-semibold">{{ data.ip }}</span>
    </div>
    <div class="flex justify-between border-b border-cyber-gray/20 pb-1.5">
      <span class="text-cyber-gray">DECK_STATUS:</span>
      <span class="text-cyber-green font-semibold">{{ data.status }}</span>
    </div>
  </div>

  <!-- Bio block -->
  <p class="mt-5 text-sm leading-relaxed text-cyber-text/90 italic font-rajdhani border-l-2 border-cyber-pink/40 pl-3">
    "{{ data.bio }}"
  </p>
</app-cyber-panel>
