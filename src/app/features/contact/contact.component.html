<div class="mb-8 border-b border-gainsboro pb-4">
  <h3 class="text-2xl font-orbitron font-bold text-text-primary tracking-wider">{{ 'contact.title' | translate }}</h3>
</div>

<form class="space-y-5" (ngSubmit)="onSubmit()">
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-text-primary uppercase tracking-wider">{{ 'contact.form.name' | translate }}</label>
    <input type="text" 
           class="w-full bg-white/50 border border-white text-text-primary px-4 py-3 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-lilac/50 transition-all placeholder-gray-400"
           placeholder="John Doe">
  </div>
  
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-text-primary uppercase tracking-wider">{{ 'contact.form.email' | translate }}</label>
    <input type="email" 
           class="w-full bg-white/50 border border-white text-text-primary px-4 py-3 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-lilac/50 transition-all placeholder-gray-400"
           placeholder="john@example.com">
  </div>
  
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-text-primary uppercase tracking-wider">{{ 'contact.form.message' | translate }}</label>
    <textarea rows="4" 
              class="w-full bg-white/50 border border-white text-text-primary px-4 py-3 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-lilac/50 transition-all placeholder-gray-400 resize-none"
              placeholder="..."></textarea>
  </div>
  
  <button type="submit" 
          class="liquid-button w-full sm:w-auto px-8 py-3 mt-4 text-sm font-bold text-text-primary hover:text-lilac uppercase tracking-widest flex items-center justify-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
    </svg>
    {{ 'contact.form.submit' | translate }}
  </button>
</form>
