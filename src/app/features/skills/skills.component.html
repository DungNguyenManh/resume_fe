<div class="mb-8 border-b border-gainsboro pb-4">
  <h3 class="text-2xl font-orbitron font-bold text-text-primary tracking-wider">{{ 'skills.title' | translate }}</h3>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
  @for (cat of data; track cat.category) {
    <div class="bg-white/40 p-5 rounded-2xl border border-white shadow-sm">
      <h4 class="font-orbitron text-sm font-bold text-text-primary uppercase tracking-wider mb-5">
        {{ 'skills.categories.' + cat.category | translate }}
      </h4>
      <div class="space-y-4">
        @for (item of cat.items; track item.name) {
          <app-progress-meter [label]="item.name" [value]="item.level"></app-progress-meter>
        }
      </div>
    </div>
  }
</div>
