<div class="space-y-2 select-none">
  <div class="flex justify-between items-center text-sm tracking-wide">
    <span class="text-text-primary font-semibold">{{ label }}</span>
    <span class="text-lilac font-bold">{{ value }}%</span>
  </div>
  
  <!-- Pill track -->
  <div class="w-full h-3 bg-gainsboro rounded-full overflow-hidden shadow-inner">
    <!-- Fill -->
    <div class="h-full bg-lilac rounded-full transition-all duration-700 ease-out shadow-sm"
         [style.width.%]="value"></div>
  </div>
</div>
